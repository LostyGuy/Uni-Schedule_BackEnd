<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uni-Schedule — Dev Diary & Progress Timeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    details summary::-webkit-details-marker { display: none; }
    details > summary { list-style: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8 font-sans antialiased">

  <div class="max-w-3xl mx-auto space-y-6">

    <!-- Top Navigation / Header -->
    <header class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 backdrop-blur-sm shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <div class="flex items-center gap-2.5">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <h1 class="text-xl font-bold tracking-tight text-white">Uni-Schedule Dev Diary</h1>
          </div>
          <p class="text-xs text-slate-400 mt-1">Granular micro-progress, test validations & technical diary</p>
        </div>

        <!-- Global Action Controls -->
        <div class="flex items-center gap-2 self-start sm:self-auto text-xs">
          <button id="btn-expand" onclick="toggleAll(true)" class="px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
            Expand all
          </button>
          <button id="btn-collapse" onclick="toggleAll(false)" class="px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 text-slate-300 hover:text-white transition-colors">
            Fold all
          </button>
        </div>
      </div>

      <!-- Search & Status Summary -->
      <div class="mt-5 pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1">
          <input
            type="text"
            id="search-input"
            oninput="handleSearch(this.value)"
            placeholder="Search diary (e.g. 'schedule', 'auth', 'collision')..."
            class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3.5 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
          />
        </div>
        <div class="text-xs text-slate-400 flex items-center gap-3">
          <span id="counter-visible" class="font-medium text-slate-300">0</span> visible
          <span class="text-slate-600">•</span>
          <span id="counter-total" class="text-slate-400">0</span> total entries
        </div>
      </div>

      <!-- Dynamic Tag Filter Bar -->
      <div class="mt-4 flex flex-wrap items-center gap-1.5" id="tag-container">
        <span class="text-xs text-slate-400 font-medium mr-1">Tags:</span>
        <!-- Tags will be dynamically injected here -->
      </div>
    </header>

    <!-- Timeline Wrapper -->
    <main class="relative pl-6 sm:pl-8 border-l-2 border-slate-800 space-y-6" id="timeline-list">
      <!-- Timeline cards injected dynamically from entries.js -->
    </main>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12 bg-slate-900/40 rounded-2xl border border-slate-800">
      <p class="text-slate-400 text-sm">No devlog entries match the selected tag or search term.</p>
      <button onclick="resetFilters()" class="mt-3 text-xs text-indigo-400 hover:underline">Reset filters</button>
    </div>

  </div>

  <!-- Load Data -->
  <script src="./entries.js"></script>

  <script>
    let activeTag = 'all';
    let searchQuery = '';

    const STATUS_CONFIG = {
      passed: {
        color: 'emerald',
        bg: 'bg-emerald-500/10',
        text: 'text-emerald-400',
        border: 'border-emerald-500/20',
        dot: 'bg-emerald-500',
        icon: '✓'
      },
      wip: {
        color: 'amber',
        bg: 'bg-amber-500/10',
        text: 'text-amber-400',
        border: 'border-amber-500/20',
        dot: 'bg-amber-500',
        icon: '⏳'
      },
      refactor: {
        color: 'purple',
        bg: 'bg-purple-500/10',
        text: 'text-purple-400',
        border: 'border-purple-500/20',
        dot: 'bg-purple-500',
        icon: '🔄'
      },
      bugfix: {
        color: 'rose',
        bg: 'bg-rose-500/10',
        text: 'text-rose-400',
        border: 'border-rose-500/20',
        dot: 'bg-rose-500',
        icon: '🐛'
      },
      feature: {
        color: 'blue',
        bg: 'bg-blue-500/10',
        text: 'text-blue-400',
        border: 'border-blue-500/20',
        dot: 'bg-blue-500',
        icon: '★'
      }
    };

    function init() {
      if (typeof ENTRIES === 'undefined' || !Array.isArray(ENTRIES)) {
        console.error('entries.js not loaded or invalid');
        return;
      }
      renderTags();
      renderTimeline();
    }

    function renderTags() {
      const tagContainer = document.getElementById('tag-container');
      const tagSet = new Set();
      ENTRIES.forEach(entry => (entry.tags || []).forEach(t => tagSet.add(t.toLowerCase())));

      const tags = ['all', ...Array.from(tagSet).sort()];

      tagContainer.innerHTML = '<span class="text-xs text-slate-400 font-medium mr-1">Tags:</span>';

      tags.forEach(tag => {
        const btn = document.createElement('button');
        btn.textContent = tag === 'all' ? 'All' : `#${tag}`;
        btn.className = getTagButtonClass(tag === activeTag);
        btn.onclick = () => selectTag(tag);
        tagContainer.appendChild(btn);
      });
    }

    function getTagButtonClass(isActive) {
      if (isActive) {
        return 'tag-chip px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-600 text-white shadow-sm transition-all';
      }
      return 'tag-chip px-2.5 py-1 rounded-full text-xs font-medium border border-slate-700 text-slate-400 hover:border-slate-500 hover:text-slate-200 transition-all';
    }

    function selectTag(tag) {
      activeTag = tag;
      renderTags();
      renderTimeline();
    }

    function handleSearch(val) {
      searchQuery = (val || '').toLowerCase().trim();
      renderTimeline();
    }

    function resetFilters() {
      activeTag = 'all';
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderTags();
      renderTimeline();
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-list');
      const emptyState = document.getElementById('empty-state');
      container.innerHTML = '';

      let visibleCount = 0;

      ENTRIES.forEach((entry, idx) => {
        // Tag filter
        const entryTags = (entry.tags || []).map(t => t.toLowerCase());
        const matchesTag = activeTag === 'all' || entryTags.includes(activeTag);

        // Search filter
        const textContent = `${entry.title} ${entry.target || ''} ${(entry.bullets || []).join(' ')} ${entryTags.join(' ')}`.toLowerCase();
        const matchesSearch = !searchQuery || textContent.includes(searchQuery);

        if (!matchesTag || !matchesSearch) return;

        visibleCount++;

        const cfg = STATUS_CONFIG[entry.status] || STATUS_CONFIG.passed;

        const item = document.createElement('div');
        item.className = 'timeline-item relative group';

        const tagBadges = (entry.tags || []).map(t =>
          `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-800 text-slate-300 border border-slate-700/60">#${t}</span>`
        ).join(' ');

        const bulletsHtml = (entry.bullets || []).map(b =>
          `<li class="leading-relaxed flex items-start gap-1.5"><span class="text-slate-500 mt-0.5">•</span><span>${b}</span></li>`
        ).join('');

        const terminalHtml = entry.terminal ? `
          <div class="mt-3 p-2.5 rounded-lg bg-black/50 border border-slate-800 font-mono text-[11px] text-emerald-400 overflow-x-auto whitespace-pre">
${entry.terminal}
          </div>` : '';

        const targetHtml = entry.target ? `
          <div class="flex items-center gap-1.5 text-xs text-slate-400">
            <span class="font-medium text-slate-300">Target:</span>
            <code class="px-1.5 py-0.5 rounded bg-slate-800 text-indigo-300 font-mono text-[11px]">${entry.target}</code>
          </div>` : '';

        item.innerHTML = `
          <!-- Node Dot on spine -->
          <div class="absolute -left-[31px] sm:-left-[39px] top-1.5 w-4 h-4 rounded-full ${cfg.dot} ring-4 ring-slate-950 flex items-center justify-center text-[10px] text-white font-bold">
            ${cfg.icon}
          </div>

          <!-- Date & Status Badge -->
          <div class="text-xs text-slate-400 mb-1.5 flex flex-wrap items-center gap-2">
            <span class="font-mono font-semibold text-slate-200">${entry.date}</span>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${cfg.bg} ${cfg.text} border ${cfg.border}">
              ${entry.badge || entry.status.toUpperCase()}
            </span>
          </div>

          <!-- Collapsible Card -->
          <details class="bg-slate-900/60 hover:bg-slate-900 border border-slate-800 rounded-xl transition-all shadow-sm" ${entry.open ? 'open' : ''}>
            <summary class="cursor-pointer p-4 flex items-start justify-between gap-3 select-none">
              <div class="space-y-2">
                <h3 class="font-semibold text-sm text-slate-100 group-hover:text-indigo-300 transition-colors">
                  ${entry.title}
                </h3>
                <div class="flex flex-wrap items-center gap-1.5">
                  ${tagBadges}
                </div>
              </div>
              <span class="text-xs text-slate-500 transform transition-transform duration-200 summary-arrow mt-1">
                ▼
              </span>
            </summary>

            <div class="px-4 pb-4 pt-2 border-t border-slate-800/60 text-xs text-slate-300 space-y-2.5">
              ${targetHtml}
              <ul class="space-y-1 text-slate-300">
                ${bulletsHtml}
              </ul>
              ${terminalHtml}
            </div>
          </details>
        `;

        container.appendChild(item);
      });

      document.getElementById('counter-visible').textContent = visibleCount;
      document.getElementById('counter-total').textContent = ENTRIES.length;

      if (visibleCount === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }
    }

    function toggleAll(open) {
      document.querySelectorAll('#timeline-list details').forEach(d => d.open = open);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
